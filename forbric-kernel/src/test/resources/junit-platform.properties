# Loads net.forbric.kernel.FixturePolicyExtension (META-INF/services), which holds every skip in the suite to
# -Dforbric.requireFixtures, including the ones thrown by a raw assumeTrue.
junit.jupiter.extensions.autodetection.enabled=true

# Windows note: do NOT add `junit.jupiter.tempdir.cleanup.mode.default=ON_SUCCESS` here expecting it to help.
# It was tried and MEASURED not to work with this project's JUnit (5.9.2).
#
# What the failures are: on Windows, deleting a jar that a ForbricClassLoader has loaded a class from fails with
# "another program is using this file", because Windows opens files without FILE_SHARE_DELETE and the JVM keeps
# the handle for the life of the loaded class. JUnit's @TempDir cleanup then cannot remove the directory and
# reports that as the TEST failing -- although every assertion in the test passed.
#
# Measured, one real run each rather than reasoning:
#   * default (ALWAYS)                 -> cleanup failure fails the test;
#   * the config key set to ON_SUCCESS -> STILL fails, so the key is not the answer;
#   * the same key set to NEVER        -> PASSES (and leaves the directory behind), which proves the key is read
#                                         and spelled correctly and that the cleanup path is the whole difference;
#   * @TempDir(cleanup = ON_SUCCESS)   -> STILL fails, so the annotation attribute is no workaround either.
# Inference: JUnit 5.9.2's CloseablePath.close() throws its accumulated IOException whatever CleanupMode
# resolved to. There is no JUnit-side switch that makes these tests pass on Windows.
#
# It is deliberately NOT set to NEVER: NEVER "passes" only by never deleting anything, which would leave a
# throwaway directory per @TempDir test (841 of them, 3.4 MB, had accumulated in this machine's TEMP) and would
# hide the cleanup path rather than report it.
#
# So the Windows failures whose ONLY failure is temp-directory cleanup are a platform limit, not a kernel
# defect. They are the same tests that pass on the ubuntu-only CI. Do not paper over them with NEVER.
#
# -----------------------------------------------------------------------------------------------------------
# Round 36-37 refinement, from reading the failure and then testing the hypothesis instead of restating it.
#
# The suppressed exception is a DIRECTORY-level one, not a file one:
#     Suppressed: java.nio.file.DirectoryNotEmptyException: ...\Temp\junit7655117097041972652
# so the accurate statement is "the files went and the directory did not".
#
# THREE hypotheses were tested against net.forbric.kernel.boot.RuntimeJarProvenanceTest (3 tests, exactly 1
# failure when run alone), and the third answer is the one that holds. Recording all three so the next reader
# does not pay for them again.
#
#   WRONG: "a test that keeps a loader alive holds the jar." ForbricClassLoader IS Closeable, and the failing
#          test already used try-with-resources; closing it changed nothing.
#
#   WRONG: "a test that LOADS A CLASS out of the temp dir is the one that fails." Measured: the failure is
#          plainAndAmbiguousCarriersDoNotGuess, which loads NO class and only calls RuntimeJarProvenance.family
#          -> MultiLoaderArbiter.declaredBy, and declaredBy closes its JarFile correctly.
#
#   MEASURED, and this is the mechanism: an @AfterEach hook that retries the delete 8 times with System.gc()
#   and a 25ms sleep between attempts, instrumented to report what Windows says, printed
#
#       [probe] junit…574 deleted by the hook on attempt 0
#       [probe] junit…072 deleted by the hook on attempt 0
#       [probe] junit…280 STILL THERE after 8 attempts; last: java.nio.file.FileSystemException:
#               C:\Users\…\junit12766535657225051280\renamed-platform.jar:
#               另一个程序正在使用此文件，进程无法访问。   ("another program is using this file")
#
#   So Windows names the file and the reason. The two directories the hook cleared were the two tests that pass;
#   the one it could not clear is the test whose jar a ForbricClassLoader had opened — and that loader had ALREADY
#   been closed by its try-with-resources by the time the hook ran (the hook runs after the test method returns).
#   A closed URLClassLoader does not release its jar's handle on Windows until the JarFile it built is collected,
#   and the hook's retries plus System.gc() did not get it there.
#
# That is why this was left undone rather than half-fixed: the failure needs the loader's JarFile to be collected,
# which no per-test edit can guarantee — a change that only SOMETIMES removes it would trade a reported platform
# limit for an intermittent failure, which is harder to read.
