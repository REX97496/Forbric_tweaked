plugins {
	id 'java'
	id 'java-library'
}

base {
	archivesName = 'forbric-kernel'
}

version = '0.1.0-SNAPSHOT'

java {
	// The sovereign kernel raises the floor to Java 21 (records, pattern switch, sealed types). The game itself
	// needs Java 25, but the boot-side kernel bytecode only needs 21; we pin release 21 so the build runs on any
	// JDK >= 21 without a separate toolchain (this machine ships JDK 25).
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Staged local artifacts the GAME-side (runtime) source set links against, compileOnly. Produced by the shared
// forbric-loader pipeline (kept as-is): run/build-merged-base.sh + run/assemble-{minecraftforge,neoforge}-runtime.sh.
// These are LGPL / Mojang-derived and are NEVER bundled — compileOnly linkage only, runtime-supplied by the user
// or installer, exactly as the old system does. The kernel stays base-jar-parametric at launch (--gameJar).
//
// The root is overridable with -Pforbric.stagedRoot=<dir> for ONE reason: the claim that a machine WITHOUT
// staged artifacts still builds an unchanged boot jar has to be testable on a machine that has them. Pointing
// it at a directory that does not exist reproduces that machine exactly, in one command, without moving a
// 35MB file another session may be running from.
// -Pforbric.stagedRoot wins; then FORBRIC_OLD, which is the one variable the run/ scripts also read, so a
// second working tree needs exactly one export rather than a different knob per tool.
//
// The preferred fallback is THIS project's own run/ directory, and it has to be, because that directory is
// where the gate scripts and their shared lib.sh live. The test wiring below passes FORBRIC_OLD the PARENT of
// this value and pairs it with `<parent>/run` -- StagedRootHandoffTest asserts that identity by name -- and the
// gate/contract suites source `run/lib.sh` out of it. `.dev/staged/run` looks tidier, being where
// `tools/dev.py prepare` puts artifacts, but no lib.sh and no gate is under it: a default there made every
// gate script exit 3 with its "no staged tree" message while the build itself looked fine. The loader tree
// cannot serve either -- it carries the pipeline scripts but none of the gates.
//
// A machine with artifacts elsewhere still overrides with -Pforbric.stagedRoot or FORBRIC_OLD; that tree then
// becomes the one FORBRIC_OLD names, so the two stay in step wherever the artifacts actually are.
def stagedRoot         = file(project.findProperty('forbric.stagedRoot')
		?: (System.getenv('FORBRIC_OLD') ? System.getenv('FORBRIC_OLD') + '/run' : file('run')))
// WHICH LINE THIS BUILD IS, resolved here rather than beside the normalisation wiring below, because the merged
// BASE is named per line and the base is the first thing this script needs. The old literal was
// `patched-mc-merged-26.2.jar` on every line, and that is a silent-wrong-number defect rather than a tidy-up: a
// 1.21.1 build with the default staged root compiled the 1.21.1-normalised sources against 26.2's bytes and
// reported ~100 errors that read as port work, and a 1.21.1 staging directory laid out the way this script's OWN
// comment at the mapping-table block says it should be ("this line's own merged base, by name") failed at
// :remapTransferApis demanding a file prepare had correctly not written. The expression is IDENTICAL to the old
// literal on the default line, because mcLineDefault IS '26.2'.
def mcLineDefault = '26.2'
def mcLine = (project.findProperty('forbric.mcLine')
		?: System.getenv('FORBRIC_MC_VERSION')
		?: mcLineDefault).toString()
def stagedMergedBase   = new File(stagedRoot, "merged-base/patched-mc-merged-${mcLine}.jar")
def stagedForgeRuntime = new File(stagedRoot, 'forge-runtime/forge-runtime.jar')
def stagedNeoRuntime   = new File(stagedRoot, 'neoforge-runtime/neoforge-runtime.jar')
def stagedGameJars = [stagedMergedBase, stagedForgeRuntime, stagedNeoRuntime].findAll { it.isFile() }

// Compile the transfer bridge against the exact API staged for the compatibility pack. These modules remain
// supplied by the installed Fabric API mod; none is bundled in either kernel jar.
//
// The transfer package is NOT optional in a built game side. It was: a missing dev-pack jar here quietly
// excluded net/forbric/kernel/runtime/transfer/** from a runtime jar that was still built and nested, the build
// stayed green, and every player with fabric-api then met KernelTransferInterop's required loss "this kernel build
// is missing its transfer component" -- a dedicated server exited 78 on a pack that launched before the bridge
// existed. A machine that builds the game side must supply the API (-Pforbric.fabricApi=<fabric-api jar>) or the
// build fails naming the file; a machine with no staged game jars builds neither half, exactly as before.
// The dev default is KEYED BY LINE, for the same reason the base above is. `.dev/api` holds one fabric-api per
// Minecraft line, and their filenames differ in BOTH the API version and the `+<mc>` suffix, so a single literal
// names one line's release. Measured cost of the old literal while the mcLine switch was 1.21.1: the 26.2
// modules were fed to the 1.21.1 -fabric-ns table and :remapTransferApis died with 30 references to
// `net/minecraft/resources/Identifier` that do not exist on 1.21.1 -- reported by an earlier round as "fails one
// task earlier at :remapTransferApis" and attributed to the base filename, which was not the cause: the base in
// that run was 1.21.1's own bytes. The glob resolves to the SAME file on the default line.
def devFabricApiCandidates = fileTree('.dev/api') { include "fabric-api-*+${mcLine}.jar" }.files.sort { it.name }
def devFabricApi = devFabricApiCandidates.isEmpty()
		? file('.dev/api/fabric-api-0.155.2+26.2.jar')
		: devFabricApiCandidates.last()
def stagedFabricApi = file(project.findProperty('forbric.fabricApi') ?: (devFabricApi.isFile() ? devFabricApi
		: new File(stagedRoot.parentFile.parentFile, 'forbric-kernel/run/client-merged-pack/mods/fabric-api-0.155.2+26.2.jar')))
def transferApiModules = ['fabric-transfer-api-v1-', 'fabric-api-lookup-api-v1-', 'fabric-api-base-']
def transferModulesDir = layout.buildDirectory.dir('transfer-api-compile')
def extractTransferApis = tasks.register('extractTransferApis', Sync) {
	onlyIf { !stagedGameJars.isEmpty() }
	// Lazy, so a missing jar reaches compileRuntimeJava's message instead of failing while inputs are snapshotted.
	from { stagedFabricApi.isFile() ? zipTree(stagedFabricApi) : files() }
	include transferApiModules.collect { "META-INF/jars/${it}*.jar" }
	eachFile { path = name }
	includeEmptyDirs = false
	into transferModulesDir
	// A fabric-api jar nesting two versions of one module would put both on the compile path; one of each.
	doLast {
		def extracted = transferModulesDir.get().asFile.listFiles()*.name
		transferApiModules.each { prefix ->
			def found = extracted.findAll { it.startsWith(prefix) && it.endsWith('.jar') }
			if (found.size() != 1) throw new GradleException("${stagedFabricApi} must nest exactly one ${prefix}*.jar; found ${found}")
		}
	}
}
def transferModuleFiles = files(fileTree(transferModulesDir) { include '*.jar' }).builtBy(extractTransferApis)

// -------------------------------------------------------------------------------------------------------
// Which transfer modules the game side compiles against
// -------------------------------------------------------------------------------------------------------
// On 26.2 these are the modules exactly as fabric-api publishes them. On a line whose fabric-api modules are
// still INTERMEDIARY-remapped they are those same modules with their class contents AND their jar entry names
// rewritten to Mojmap by remapTransferApis -- without that, every fabric signature that mentions a Minecraft
// type names net/minecraft/class_1799, which does not exist in the line's Mojmap jar, and no Mojmap source set
// can read it. The line is read HERE, above the source set below, so the 26.2 branch is the same file
// collection it always was and its build graph does not gain a task.
//
// The line itself (and why it is a declared property rather than an inference) is explained under
// "The Minecraft line: one source tree, two sets of class names" further down. `mcLine` / `mcLineDefault` are
// declared at the TOP of this script, above the staged root: the merged base is named per line and is needed
// there. It is one value read by two blocks, not two knobs.
def fabricNsTable = file("src/runtime/mc-line/${mcLine}-fabric-ns.tsv")
def remappedTransferDir = layout.buildDirectory.dir("transfer-api-mc/${mcLine}")
def transferJarsForLine = mcLine == mcLineDefault
		? transferModuleFiles
		: files(fileTree(remappedTransferDir) { include '*.jar' }).builtBy('remapTransferApis')
// Team Reborn Energy 5.0.0 (mod id team_reborn_energy, MIT), the energy API Fabric mods use: Fabric API has none.
// The energy half of the transfer component compiles against it and, like the transfer modules, it is never bundled:
// a pack that wants Fabric energy installs it as an ordinary mod. Same rule as above: a machine that builds the game
// side must supply it (-Pforbric.rebornEnergy=<energy jar>) or the build fails naming the file, so no game side can
// quietly ship without the energy bridge.
//
// Builds accept any implementation/release that preserves the declared public binary API. A file hash is
// identity evidence, not ABI compatibility; ApiJarContract checks members without initializing mod classes.
def rebornEnergyDefaults = [file('.dev/api/energy-5.0.0.jar'),
		new File(stagedRoot.parentFile.parentFile, 'forbric-kernel/run/energy-api/energy-5.0.0.jar'),
		file('run/energy-api/energy-5.0.0.jar')]
def stagedRebornEnergy = file(project.findProperty('forbric.rebornEnergy')
		?: (rebornEnergyDefaults.find { it.isFile() } ?: rebornEnergyDefaults[0]))
// -------------------------------------------------------------------------------------------------------------
// THE ENERGY JAR'S CLASS-FILE VERSION IS A PROPERTY OF THE JDK THAT BUILDS THE LINE, NOT OF THE LINE.
//
// `.dev/api/energy-5.0.0.jar` holds 12 class files at version 69 (Java 25, Team Reborn's own release). The 1.21.1
// line is built by a JDK 21, and that javac refuses a class file newer than the version it targets -- "bad class
// file ... class file has wrong version 69.0, should be 65.0" -- after which every team.reborn.energy reference
// fails as `cannot find symbol`. Measured, not inferred: 225 errors with the shipped jar against 200 with a
// class-65 copy, so 25 errors -- one eighth of the remaining distance -- were a staging defect wearing port
// clothes.
//
// This is the DANGER shape in a second place, and NOT the same shape. The merged base's defect is one unversioned
// FILENAME holding two lines' different bytes. Here one FILE holds one line's bytes and two JDKs disagree about
// whether they may read it: the shipped jar is a 26.x artifact, 26.2's JDK 25 reads class 69 without complaint
// (measured: the same jar under a JDK-25 javac with the same `--release 21` is read, and the compile proceeds to
// unrelated errors), and only a JDK whose maximum class-file version is 65 refuses it. So the default line needs
// no edition and MUST NOT get one: its classpath stays the shipped FileCollection it always was.
//
// The fix is per-line and produced BY THIS BUILD rather than staged by hand into a gitignored directory. On any
// line but the default, `retargetRebornEnergy` writes a copy whose ONLY difference is the u2 major-version field
// of the class entries that need lowering (69 -> 65 is 0x0045 -> 0x0041, so exactly ONE byte per class moves);
// both the compile classpath and `verifyRebornEnergy` consume that output. The task is NOT REGISTERED on the
// default line, so 26.2 gains no task and no byte.
//
// What this is not: a Java-21 build of the library. It is the same bytes under a lower version stamp -- proven by
// `verifyRebornEnergy`, which runs ApiJarContract over the MEMBERS rather than over a hash -- and it must never be
// shipped. The runtime jar's own entry check already refuses to bundle team/reborn/ classes.
def energyTargetMajor = 44 + project.java.targetCompatibility.majorVersion.toInteger()   // --release 21 -> 65
def energyOutName = (stagedRebornEnergy.name.endsWith('.jar')
		? stagedRebornEnergy.name.substring(0, stagedRebornEnergy.name.length() - 4)
		: stagedRebornEnergy.name) + '-j' + project.java.targetCompatibility.majorVersion + '.jar'
def energyForLineFile = mcLine == mcLineDefault
		? stagedRebornEnergy
		: layout.buildDirectory.file("energy-api/${mcLine}/${energyOutName}").get().asFile
def energyForLine = mcLine == mcLineDefault
		? files(stagedRebornEnergy)
		: files(energyForLineFile).builtBy('retargetRebornEnergy')
if (mcLine != mcLineDefault) {
	tasks.register('retargetRebornEnergy') {
		group = 'build'
		description = "Lowers the energy API jar's class-file version to ${energyTargetMajor} so a JDK " +
				"${project.java.targetCompatibility.majorVersion} build can read it; every other byte is the input's."
		// The OUTPUT is what the classpath and verifyRebornEnergy consume, so both are keyed on this task through
		// `energyForLine` rather than on the shared file. Preview-featured class files are refused: their version
		// cannot be lowered by a stamp, and pretending otherwise would trade a clear "wrong version" for a
		// VerifyError at load time.
		inputs.file(stagedRebornEnergy).withPropertyName('energyImplementation').optional()
		inputs.property('classFileMajor', energyTargetMajor)
		outputs.file(energyForLineFile)
		doLast {
			File src = stagedRebornEnergy
			if (!src.isFile()) throw new GradleException("The energy adapter needs a jar exposing its public API: " +
					src + ". Pass -Pforbric.rebornEnergy=<compatible energy API jar>.")
			energyForLineFile.parentFile.mkdirs()
			int retargeted = 0, alreadyReadable = 0, nonClass = 0
			def versionsSeen = new TreeMap<Integer, Integer>()
			new java.util.zip.ZipFile(src).withCloseable { zip ->
				energyForLineFile.withOutputStream { raw ->
					def out = new java.util.zip.ZipOutputStream(raw)
					try {
						zip.entries().each { entry ->
							byte[] data = zip.getInputStream(entry).bytes
							boolean isClass = data.length >= 8 && (data[0] & 0xFF) == 0xCA && (data[1] & 0xFF) == 0xFE
									&& (data[2] & 0xFF) == 0xBA && (data[3] & 0xFF) == 0xBE
							if (isClass) {
								int minor = ((data[4] & 0xFF) << 8) | (data[5] & 0xFF)
								int major = ((data[6] & 0xFF) << 8) | (data[7] & 0xFF)
								versionsSeen.merge(major, 1) { a, b -> a + b }
								if (major > energyTargetMajor) {
									if (minor == 0xFFFF) throw new GradleException("${src.name}: ${entry.name} is " +
											"compiled with PREVIEW features (minor 0xFFFF). Its class-file version " +
											"cannot be lowered to ${energyTargetMajor} by a version stamp; supply a " +
											"Java ${project.java.targetCompatibility.majorVersion} build of it instead.")
									data[6] = (byte) ((energyTargetMajor >> 8) & 0xFF)
									data[7] = (byte) (energyTargetMajor & 0xFF)
									retargeted++
								} else {
									alreadyReadable++
								}
							} else {
								nonClass++
							}
							// Entry list, order and per-entry compression are preserved, so the only difference a
							// reader can find is the version field -- the one-variable property the ABI check is about.
							def outEntry = new java.util.zip.ZipEntry(entry.name)
							outEntry.method = entry.method
							if (entry.time >= 0) outEntry.time = entry.time
							if (entry.method == java.util.zip.ZipEntry.STORED) {
								def crc = new java.util.zip.CRC32()
								crc.update(data)
								outEntry.size = data.length
								outEntry.compressedSize = data.length
								outEntry.crc = crc.value
							}
							out.putNextEntry(outEntry)
							out.write(data)
							out.closeEntry()
						}
					} finally {
						out.close()
					}
				}
			}
			// Prove the claim from the two files rather than from the writer's intent -- the same rule the normaliser
			// and the remapper are held to. The assertion is STRUCTURAL: the version field at offset 6..7 is the only
			// thing allowed to move. It is deliberately NOT "two bytes differ": 69 -> 65 moves the low byte only, so
			// the honest count is one byte per retargeted class, and an assertion on the decimal spelling rather than
			// on the field would reject a correct output.
			int changedBytes = 0
			new java.util.zip.ZipFile(src).withCloseable { a ->
				new java.util.zip.ZipFile(energyForLineFile).withCloseable { b ->
					def before = a.entries()*.name
					def after = b.entries()*.name
					if (before != after) throw new GradleException("${energyForLineFile.name}: the entry list or its " +
							"order changed -- the input had ${before.size()} entries, the output ${after.size()}")
					before.each { String name ->
						byte[] x = a.getInputStream(a.getEntry(name)).bytes
						byte[] y = b.getInputStream(b.getEntry(name)).bytes
						if (x.length != y.length) throw new GradleException("${name}: length changed ${x.length} -> ${y.length}")
						boolean same = true
						for (int i = 0; i < x.length && same; i++) if (x[i] != y[i]) same = false
						if (same) return
						if (x.length < 8) throw new GradleException("${name}: only ${x.length} bytes, cannot be a class")
						for (int i = 0; i <= 5; i++) if (x[i] != y[i]) throw new GradleException(
								"${name}: byte ${i} (before the version field) changed; only the class-file version may move")
						int outMajor = ((y[6] & 0xFF) << 8) | (y[7] & 0xFF)
						if (outMajor != energyTargetMajor) throw new GradleException("${name}: output class-file version " +
								"is ${outMajor}, expected ${energyTargetMajor}")
						for (int i = 8; i < x.length; i++) if (x[i] != y[i]) throw new GradleException(
								"${name}: byte ${i} (after the version field) changed; only the class-file version may move")
						if (x[6] != y[6]) changedBytes++
						if (x[7] != y[7]) changedBytes++
					}
				}
			}
			logger.lifecycle("[forbric] energy ${mcLine}: ${src.name} (class ${versionsSeen.keySet().join('/')}) -> " +
					"${energyForLineFile.name} (class ${energyTargetMajor}); ${retargeted} class file(s) retargeted " +
					"(${changedBytes} byte(s) moved, all inside the u2 major-version field), " +
					"${alreadyReadable} already readable, ${nonClass} non-class entries copied untouched")
		}
	}
}
// Integration runs pass -Pforbric.requireTransfer=true: there a skipped transfer suite is a failure, not a pass.
def strictIntegration = gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'integrationTest' }
def requireTransfer = project.findProperty('forbric.requireTransfer') == 'true' || strictIntegration
// CI passes -Pforbric.skipBaseline=<profile>: then the tests skipped in this invocation must equal the committed
// src/test/skip-baseline/<profile>.tsv (see skipRatchet). A skip passes Gradle, so without this a test that started
// skipping looks exactly like one that passed.
def skipBaseline = project.findProperty('forbric.skipBaseline')
if (skipBaseline != null && !(skipBaseline ==~ /[a-z0-9-]+/)) {
	throw new GradleException("forbric.skipBaseline must be [a-z0-9-]+, got '${skipBaseline}'")
}

// Minecraft's OWN libraries, for the game-side set only. A game-side class cannot build a piece of text without
// brigadier: net.minecraft.network.chat.Component extends com.mojang.brigadier.Message, so javac needs it to read
// the Component class file at all. It is not on Maven Central (Mojang's own maven serves it), the game supplies it
// at runtime, and the kernel never ships it — so it is taken from the same local Minecraft install the staged
// artifacts were derived from, and its absence is not fatal: it costs the game-side set, which already skips when
// the staged jars are absent.
def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def defaultMinecraft = osName.contains('windows')
		? new File(System.getenv('APPDATA') ?: System.getProperty('user.home') + '/AppData/Roaming', '.minecraft')
		: new File(System.getProperty('user.home'), osName.contains('mac') ? 'Library/Application Support/minecraft' : '.minecraft')
def devMinecraft = file('.dev/minecraft')
// .dev/minecraft is preferred only while it has its version JSON, because the transfer suite's library list below is
// read from that JSON. A tree without it is a tree with no libraries as far as that list goes. One here had all 73
// jars it needs and no 26.2.json (removed after prepare had finished; what removed it is unknown), and preferring
// it because the directory existed sent the transfer suite into ClassNotFoundException for netty and Commons Lang
// with nothing saying why. The JSON is NOT proof that prepare finished -- it is the first file prepare writes -- so
// the transferTest guard below also names any library the JSON lists that is not on disk.
def devMinecraftPrepared = new File(devMinecraft, 'versions/26.2/26.2.json').isFile()
if (devMinecraft.isDirectory() && !devMinecraftPrepared && !project.hasProperty('forbric.mcLibraries') && !System.getenv('MC_DIR'))
	logger.lifecycle("[forbric] ${devMinecraft} has no versions/26.2/26.2.json, so Minecraft's libraries come from " +
			"${defaultMinecraft}; run `python tools/dev.py prepare` to restore it")
def mcLibraries = file(project.findProperty('forbric.mcLibraries')
		?: (System.getenv('MC_DIR') ? System.getenv('MC_DIR') + '/libraries'
				: new File(devMinecraftPrepared ? devMinecraft : defaultMinecraft, 'libraries')))
// One jar PER PATTERN, never one across all of them: a single fileTree over several includes and a global
// takeRight(1) keeps whichever name sorts last and silently drops the rest — with brigadier and datafixerupper
// in the same tree, 'd' > 'b' and brigadier disappears. Last-by-NAME within a pattern is not version-aware
// either ("10.0.21" sorts before "9.0.19"); that is tolerable only because any version of these two satisfies
// javac's need to READ the class files, which is all they are here for.
def lastByNameUnder = { String pattern ->
	mcLibraries.isDirectory()
			? fileTree(mcLibraries) { include pattern }.files.sort { it.name }.takeRight(1)
			: []
}
// datafixerupper for the same reason as brigadier, one type further in: net.minecraft.core.Registry implements
// com.mojang.serialization.Keyable, so javac cannot read Registry — and so cannot read BuiltInRegistries —
// without it. KernelParticleProviders needs the particle registry to translate its keys.
def stagedMcLibraries = lastByNameUnder('com/mojang/brigadier/**/*.jar') +
		lastByNameUnder('com/mojang/datafixerupper/**/*.jar') +
		// gson, for the same reason and one layer out: fabric-api's resource-condition evaluator takes a
		// JsonObject, so KernelFabricConditions cannot name its own argument without it. Taken from the same
		// local Minecraft install as the other two, never bundled — the game supplies it at runtime.
		lastByNameUnder('com/google/code/gson/**/*.jar') +
		// netty's buffer types, for the same reason: KernelRecipeSync trial-encodes a recipe into a
		// RegistryFriendlyByteBuf, which IS a netty ByteBuf, so javac cannot read it without them. Never bundled.
		lastByNameUnder('io/netty/netty-buffer/**/*.jar') +
		lastByNameUnder('io/netty/netty-common/**/*.jar')

// LazyOptional's real carrier implementation uses Commons Lang's Mutable types, and every Team Reborn Energy store
// initialises Reborn's EnergyStorage interface, whose static fields build an Identifier and a DataComponentType
// (netty, joml, ...). Resolve Minecraft 26.2's OWN library set from its version JSON (the one launch-kernel-server.sh
// puts on the game's classpath), rather than a stub or whichever cached jar happens to sort last. This is test
// runtime linkage only and is never bundled.
def stagedTransferTestLibraries = []
// Libraries the JSON lists for every platform (no OS rules) that are not on disk. Those with rules are natives for one
// OS, so the other platforms' copies being absent is normal.
def missingTransferTestLibraries = []
def stagedMcVersionJson = new File(mcLibraries.parentFile, 'versions/26.2/26.2.json')
if (stagedMcVersionJson.isFile()) {
	def versionMetadata = new groovy.json.JsonSlurper().parse(stagedMcVersionJson)
	versionMetadata.libraries.each { library ->
		def relativePath = library.downloads?.artifact?.path
		if (relativePath) {
			def artifact = new File(mcLibraries, relativePath)
			if (artifact.isFile()) stagedTransferTestLibraries.add(artifact)
			else if (!library.rules) missingTransferTestLibraries.add(relativePath)
		}
	}
}

sourceSets {
	// `main` keeps the Gradle defaults (src/main/java, src/main/resources). Re-declaring them with srcDir would
	// ADD the same directory a second time, and every resource would then be a duplicate entry — which fails
	// processResources outright (it did, the moment the Mixin META-INF/services files landed).
	//
	// GAME side: everything that references net.minecraft.* / net.minecraftforge.* / net.neoforged.* /
	// net.fabricmc.fabric.* — defined by ForbricClassLoader at runtime, packaged as forbric-kernel-runtime.jar and
	// appended to the game classpath (NOT a fabric mod). Typed against the staged jars instead of reflected.
	// If the staged jars are absent, this set has nothing to link against; the guard task below fails loudly with
	// the build script to run, and `compileRuntimeJava` / `test` skip it so M0 (boot-side only) still builds.
	runtime {
		java { srcDir 'src/runtime/java' }
		// net/forbric/compat holds the stand-ins for 26.2 types that a NON-default line lacks, and to do its job it
		// names that line's own Minecraft types: ForbricPip.Renderer's SAM takes net.minecraft.client.gui.GuiGraphics,
		// which 26.2 calls GuiGraphicsExtractor, and ForbricUnbakedModelParser used ResourceLocation, which 26.2
		// calls Identifier. Nothing reaches these classes on the default line -- the rename table that points at
		// them is only applied when mcLine != default -- so compiling them there can only fail, and it did.
		// Excluded on the default line only; every other line keeps them.
		if (mcLine == mcLineDefault) {
			java { exclude 'net/forbric/compat/**' }
		}
		// `energyForLine`, not `files(stagedRebornEnergy)`: on the default line that IS the shipped FileCollection
		// (same file, same bytes, no task), and on any other line it is the build-produced class-version edition
		// that the line's own javac can read. See the energy block above.
		compileClasspath += sourceSets.main.output + files(stagedGameJars) + files(stagedMcLibraries) + transferJarsForLine + energyForLine
		runtimeClasspath += sourceSets.main.output + files(stagedGameJars) + files(stagedMcLibraries) + transferJarsForLine + energyForLine
	}
	transferTest {
		java { srcDir 'src/transferTest/java' }
		compileClasspath += sourceSets.runtime.output + sourceSets.runtime.compileClasspath
		runtimeClasspath += sourceSets.runtime.output + sourceSets.runtime.compileClasspath + files(stagedTransferTestLibraries)
	}
	// A stand-in for Mod Menu's API (com.terraformersmc.modmenu.api): the interface every Fabric mod with a config
	// screen implements, and the only place a Fabric mod ever says it has one. Compiled against the game side, and
	// shipped INSIDE the game-side jar as resources, never as classes -- see runtimeJar. A class file there would be
	// one of ForbricClassLoader's own, found before any mod's, and would shadow a real Mod Menu. As resources they
	// are offered by ModMenuApiStandIn only when no installed jar has the real API, and the loader consults offered
	// bytes only after every owned jar has missed, so a real Mod Menu always wins.
	modMenuApi {
		java { srcDir 'src/modmenuApi/java' }
		compileClasspath += sourceSets.runtime.output + sourceSets.main.output + files(stagedGameJars) + files(stagedMcLibraries)
	}
	// The byte-merge tools (MergedBaseBuilder, AdditiveMethodMerger, RuntimeInteropPatcher, MergedLinkChecker).
	// They are build-time programs, not kernel or game code: they read jars and write jars, never run inside the
	// game, and nothing in src/main or src/runtime references them. They compile against ASM alone and ship in
	// their own jar, which is run as a subprocess with a 4 GB heap this JVM cannot grant itself.
	//
	// They live HERE now, not in the first generation's forbric-loader/src/tools. Until this moved, producing the
	// kernel's own staged game artifacts required another Gradle project's build to run first, so this project
	// could not build its game side with only this checkout -- the last structural dependency on the first
	// generation. The package (net.forbric.tools) and every source file are unchanged by the move: the tools
	// never referenced loader code, so only the directory and the task that packages them had to change.
	tools {
		java { srcDir 'src/tools/java' }
		// Resources keep the DEFAULT convention (src/tools/resources). Naming that same directory explicitly as
		// well made every resource a duplicate entry and failed processToolsResources outright.
	}
}

// -------------------------------------------------------------------------------------------------------
// The Minecraft line: one source tree, two sets of class names
// -------------------------------------------------------------------------------------------------------
//
// The runtime sources are written in the 26.2 namespace. A second line cannot share them and cannot be served
// by renaming them either, because the names are MUTUALLY EXCLUSIVE rather than merely different:
//
//     net.minecraft.resources.Identifier       26.2=PRESENT  1.21.1=absent
//     net.minecraft.resources.ResourceLocation 26.2=absent   1.21.1=PRESENT
//
// Whichever spelling is written into the sources, the other line stops compiling. That was measured against
// both staged merged bases (10,973 vs 10,978 classes), not inferred from a changelog; the same probe covers
// every entry in the table below.
//
// So the second line gets an explicit, reviewable rename table applied to a COPY of the sources at build time:
// src/runtime/mc-line/<line>.tsv. This is the compile-time twin of what ForbricMappings already does to
// bytecode at runtime -- a declared table, not behaviour hidden in a task -- and it is the only mechanism that
// carries type positions (118 of the 136 `Identifier` occurrences are declarations, generics or `.class`
// literals; no wrapper can absorb those without rewriting every vanilla call that takes or returns one).
//
// NOTHING HAPPENS ON 26.2. The task and the srcDir swap are inside `if (mcLine != mcLineDefault)`, so the
// default build's source dir is still src/runtime/java and no extra task joins its graph: a 26.2 build is the
// same build it was before this block existed.
//
// The line comes from -Pforbric.mcLine, then FORBRIC_MC_VERSION (the variable tools/dev.py already reads), then
// 26.2. A line with no table is a hard failure naming the file, never a silent identity build.
// mcLine and mcLineDefault are declared above the transfer-module wiring, which needs them first.
def mcLineRenames = file("src/runtime/mc-line/${mcLine}.tsv")
def mcLineJava = layout.buildDirectory.dir("generated/mc-line/${mcLine}/java")
// SOME DIFFERENCES ARE NOT RENAMES, so the same knob also carries a source overlay: a file under this directory
// REPLACES the file at the same relative path under src/runtime/java, verbatim -- no rename rule is applied to it,
// because it is already written in the line's own names. That is the difference between "this symbol is spelled
// differently here" (a table row) and "this subsystem is a different subsystem here" (a file). It is still ONE
// version knob: the directory is keyed by the same mcLine, and a target with no overlay simply has none.
//   guard: every overlay file must replace a real source file, or the build fails naming it. An overlay that has
//   outlived its base file would otherwise sit in the tree as a silent extra class nobody compiles.
def mcLineOverlay = file("src/runtime/mc-line/${mcLine}/java")
def overlaidFiles = []
if (mcLineOverlay.isDirectory()) {
	def overlayRootPath = mcLineOverlay.toPath()
	fileTree(mcLineOverlay).files.each { File overlayed ->
		overlaidFiles << overlayRootPath.relativize(overlayed.toPath()).toString().replace(File.separator, '/')
	}
	overlaidFiles.sort()
}
def normalizeRuntimeJava = null

if (mcLine != mcLineDefault) {
	normalizeRuntimeJava = tasks.register('normalizeRuntimeJava', Sync) {
		group = 'build'
		description = "Rewrites the runtime sources into Minecraft ${mcLine}'s own class names (see ${mcLineRenames.name})."
		from 'src/runtime/java'
		into mcLineJava
		// inputs.files, not inputs.file: @InputFile requires the file to exist and Gradle then fails at snapshot
		// time with "an input file was expected to be present", which names the file but not the two ways out of
		// it. @InputFiles does not require existence, so the doLast throw below can state both -- and an edit to
		// the table still invalidates this task.
		inputs.files(mcLineRenames).withPropertyName('mcLineRenames')
		if (mcLineOverlay.isDirectory()) inputs.dir(mcLineOverlay).withPropertyName('mcLineOverlay')
		doFirst {
			overlaidFiles.each { String rel ->
				if (!new File(file('src/runtime/java'), rel).isFile()) {
					throw new GradleException("${mcLineOverlay}/" + rel + " replaces nothing: src/runtime/java/" + rel
							+ " does not exist. An overlay file REPLACES the file at the same path; a new file has no base"
							+ " to replace and would have to be a genuine addition to both lines instead.")
				}
			}
		}
		doLast {
			if (!mcLineRenames.isFile()) {
				throw new GradleException("Minecraft ${mcLine} has no rename table: ${mcLineRenames} is absent. " +
						"Add one following the format documented inside it, or pass -Pforbric.mcLine=" + mcLineDefault + ".")
			}
			// [from, to] in file order; applied longest-name-first so a fully-qualified rule always beats its
			// own simple name (`net.minecraft.resources.Identifier` before `Identifier`).
			def rules = []
			mcLineRenames.eachLine('UTF-8') { String raw ->
				def line = raw.trim()
				if (line.isEmpty() || line.startsWith('#')) return
				def parts = raw.split('\t')
				if (parts.length != 2 || parts[0].isEmpty() || parts[1].isEmpty()) {
					throw new GradleException("${mcLineRenames}: not '<from>TAB<to>': ${raw}")
				}
				rules << [parts[0], parts[1]]
			}
			rules.sort { a, b -> b[0].length() <=> a[0].length() }
			def hits = new LinkedHashMap<String, Integer>()
			rules.each { hits[it[0]] = 0 }

			def sourceRoot = file('src/runtime/java').toPath()
			def outputRoot = mcLineJava.get().asFile
			fileTree('src/runtime/java').files.sort { it.path }.each { File source ->
				def relative = sourceRoot.relativize(source.toPath()).toString().replace(File.separator, '/')
				// An overlaid file is written VERBATIM from the overlay below, with no rule applied to it: it is
				// already written in this line's own names, and a rule that matched inside it would be a guess.
				if (overlaidFiles.contains(relative)) return
				def text = source.getText('UTF-8')
				rules.each { rule ->
					// Whole-token only: `Identifier` must not reach inside `KernelIdentifier`, and `identifier()`
					// must not become `location()` inside a longer name.
					def pattern = java.util.regex.Pattern.compile(
							'(?<![A-Za-z0-9_$])' + java.util.regex.Pattern.quote(rule[0]) + '(?![A-Za-z0-9_$])')
					def matcher = pattern.matcher(text)
					def buffer = new StringBuffer()
					int count = 0
					while (matcher.find()) {
						matcher.appendReplacement(buffer, java.util.regex.Matcher.quoteReplacement(rule[1]))
						count++
					}
					matcher.appendTail(buffer)
					if (count > 0) {
						text = buffer.toString()
						hits[rule[0]] = hits[rule[0]] + count
					}
				}
				File target = new File(outputRoot, sourceRoot.relativize(source.toPath()).toString())
				target.parentFile.mkdirs()
				target.setText(text, 'UTF-8')
			}
			// THE OVERLAY, verbatim. These are the differences that are not renames: a subsystem this line spells
			// with different types throughout, which no token table can carry.
			fileTree(mcLineOverlay).files.sort { it.path }.each { File source ->
				def relative = mcLineOverlay.toPath().relativize(source.toPath()).toString()
				File target = new File(outputRoot, relative)
				target.parentFile.mkdirs()
				target.setText(source.getText('UTF-8'), 'UTF-8')
			}
			if (!overlaidFiles.isEmpty()) logger.lifecycle("[forbric] mc-line ${mcLine}: ${overlaidFiles.size()} file(s) REPLACED by ${mcLineOverlay.name}")
			// A rule that matched nothing is stale -- the source moved on, or the entry was always wrong. It is
			// an error rather than a no-op because the failure it would otherwise cause is a compile error on
			// the other line, which reads as an engine difference for a whole afternoon.
			def unused = hits.findAll { entry -> entry.value == 0 }.collect { entry -> entry.key }
			if (!unused.isEmpty()) {
				throw new GradleException("${mcLineRenames}: ${unused.size()} rule(s) matched nothing in src/runtime/java: "
						+ "${unused}. Either the symbol is gone from the sources or its 26.2 spelling changed.")
			}
			hits.each { name, count ->
				logger.lifecycle("[forbric] mc-line ${mcLine}: ${count}x ${name}")
			}
		}
	}
	sourceSets.runtime.java.setSrcDirs([])
	sourceSets.runtime.java.srcDir(mcLineJava)
	tasks.named('compileRuntimeJava') { dependsOn normalizeRuntimeJava }
	logger.lifecycle("[forbric] Minecraft line ${mcLine}: runtime sources are normalised through ${mcLineRenames.name}")

	// ---------------------------------------------------------------------------------------------------
	// The BOOT half is line-keyed too, and it is line-keyed in STRINGS
	// ---------------------------------------------------------------------------------------------------
	//
	// src/main holds no Minecraft type by design -- that is what makes it the boot half -- so javac resolves none
	// of the ~2,275 names it spells, and a name that does not exist on this line compiles cleanly and fails only
	// when the string is USED. Stage 7 counted it; stage 10 measured it (docs/1.21.1-port.md): 253 dead
	// references in 71 boot files, of which 31 are sites that RESOLVE the name (Class.forName / getMethod /
	// invokeStaticOn / startBus) rather than match it.
	//
	// WHICH MECHANISM, AND WHY NOT THE TWO THIS SCRIPT ALREADY HAS
	//
	//   * the runtime half's rename table cannot be pointed at src/main: the SAME token is a resolution name in
	//     one file and pin data in another. `net.minecraft.resources.Identifier` occurs at 2 resolution sites and
	//     at 18 pin/anchor sites, and MixinEquivalentImplementations pairs its spelling with a 26.2 BODY HASH --
	//     renaming the spelling there leaves the hash 26.2's and makes a pin that is internally inconsistent
	//     rather than true. A table cannot tell the two kinds apart; this file can, per site.
	//   * the runtime half's file overlay would be honest and would mean duplicating KernelClientSmoke.java
	//     (2,600 lines) to change two strings in it.
	//   * a per-line edition of the CENSUS TABLES is refused outright (see docs): every row is measured output of
	//     a census over one merged base, and renaming inside it would leave 26.2's descriptors, counts, hashes and
	//     ecosystems under a header claiming a line it was never run against. src/main/resources is deliberately
	//     NOT in this block's scope, so the refusal is enforced by the mechanism's shape.
	//
	// So: EXACT substitutions, one row per site, with the expected occurrence count as an assertion. It cannot
	// over-apply (a row is a whole site, not a token), it fails loudly when the source moves (count mismatch), and
	// on the default line it does not exist at all: no task, no generated source dir, no input, no byte.
	//
	// Format, one row per line, TAB separated, `#` starts a comment:
	//   <path relative to src/main/java> \t <occurrences> \t <exact old text> \t <exact new text>
	def mcLineBootPatches = file("src/main/mc-line/${mcLine}.patches")
	def mcLineBootJava = layout.buildDirectory.dir("generated/mc-line/${mcLine}/boot-java")
	def normalizeBootJava = tasks.register('normalizeBootJava', Sync) {
		group = 'build'
		description = "Applies ${mcLineBootPatches.name}'s exact substitutions to a copy of src/main/java."
		from 'src/main/java'
		into mcLineBootJava
		inputs.files(mcLineBootPatches).withPropertyName('mcLineBootPatches')
		doFirst {
			if (mcLineBootPatches.isFile()) {
				// A row that parses wrong is a row that would silently not apply, so the parse is strict.
				mcLineBootPatches.eachLine('UTF-8') { String raw ->
					def line = raw
					if (line.trim().isEmpty() || line.trim().startsWith('#')) return
					def parts = line.split('\t', -1)
					if (parts.length != 4) {
						throw new GradleException("${mcLineBootPatches}: not '<file> TAB <count> TAB <old> TAB <new>': ${raw}")
					}
					if (parts[2] == parts[3]) {
						throw new GradleException("${mcLineBootPatches}: a row whose old and new text are identical is a"
								+ " lie about a correction that did not happen: ${raw}")
					}
					if (!new File(file('src/main/java'), parts[0]).isFile()) {
						throw new GradleException("${mcLineBootPatches}: ${parts[0]} does not exist under src/main/java")
					}
					if (!(parts[1] ==~ /[0-9]+/) || parts[1].toInteger() < 1) {
						throw new GradleException("${mcLineBootPatches}: the occurrence count must be a positive integer,"
								+ " because it is the assertion that the site is still where the row says: ${raw}")
					}
				}
				logger.lifecycle("[forbric] mc-line ${mcLine}: boot half patched through ${mcLineBootPatches.name}")
			} else {
				logger.lifecycle("[forbric] mc-line ${mcLine}: no ${mcLineBootPatches.name} — the boot half takes no"
						+ " line-keyed correction on this line")
			}
		}
		doLast {
			if (!mcLineBootPatches.isFile()) return
			def root = mcLineBootJava.get().asFile
			mcLineBootPatches.eachLine('UTF-8') { String raw ->
				if (raw.trim().isEmpty() || raw.trim().startsWith('#')) return
				def parts = raw.split('\t', -1)
				File target = new File(root, parts[0])
				String text = target.getText('UTF-8')
				int expected = parts[1].toInteger()
				int found = 0
				int at = text.indexOf(parts[2])
				while (at >= 0) { found++; at = text.indexOf(parts[2], at + parts[2].length()) }
				if (found != expected) {
					throw new GradleException("${mcLineBootPatches}: ${parts[0]} holds ${found} occurrence(s) of the"
							+ " row's text, expected ${expected}. The site moved or was edited; re-adjudicate the row"
							+ " against Minecraft ${mcLine} and update the count. Row: ${parts[2]}")
				}
				target.setText(text.replace(parts[2], parts[3]), 'UTF-8')
				logger.lifecycle("[forbric] mc-line ${mcLine}: boot patch applied ${found}x in ${parts[0]}")
			}
		}
	}
	sourceSets.main.java.setSrcDirs([])
	sourceSets.main.java.srcDir(mcLineBootJava)
	tasks.named('compileJava') { dependsOn normalizeBootJava }

	// ---------------------------------------------------------------------------------------------------
	// The line's CENSUS TABLES — measured for this line, never renamed into place
	// ---------------------------------------------------------------------------------------------------
	//
	// The eight tables under src/main/resources/net/forbric/kernel/ are the measured output of eight census tests
	// over ONE merged base, and on 1.21.1 2,460 of their rows name something this line does not have — 115 of them
	// with a KEY that resolves here and a TARGET that does not, so the rule can match and rewrite a selector to a
	// member this line lacks (docs/1.21.1-port.md, stage 10). They cannot be fixed by renaming inside them: the
	// descriptors, counts, hashes and ecosystems are 26.2's, and a hand-made edition would be fabricated evidence
	// that nothing can detect. They can only be RE-RUN.
	//
	// The producer of each table is the census TEST itself (see net.forbric.kernel.CensusTable and
	// TestFixtures.censusLine). This line's suite cannot run — `test` depends on compileRuntimeJava, and the game
	// side is the 190 errors — but the TEST half compiles, because no test source names a Minecraft type. So:
	//
	//   lineCensus            runs the tagged producers on THIS line's classpath and compares each table to the
	//                         committed edition. It is the verification: a hand-edited row fails it.
	//   -Pforbric.censusWrite regenerates instead of comparing, writing into src/main/mc-line/<line>-tables/.
	//                         The first pass reports the mismatch it just wrote over; the second is the check.
	//   normalizeBootResources copies src/main/resources and overlays this line's edition on top, so the jar this
	//                         line builds carries the tables that were measured FOR it.
	//
	// NOTHING HAPPENS ON 26.2. No task, no extra source directory, no resource — the default build's resources are
	// exactly src/main/resources and its graph gains nothing. That has to be true byte-for-byte: the 26.2 tables are
	// the ones every existing consumer was written against, and `-Pforbric.censusWrite` on the default line is
	// checked by `git diff` being empty afterwards rather than by this comment.
	def mcLineTables = file("src/main/mc-line/${mcLine}-tables")
	def mcLineResources = layout.buildDirectory.dir("generated/mc-line/${mcLine}/resources")
	def normalizeBootResources = tasks.register('normalizeBootResources', Sync) {
		group = 'build'
		description = "Copies src/main/resources and overlays Minecraft ${mcLine}'s own census tables on top."
		from 'src/main/resources'
		into mcLineResources
		// Declared so an edited — or re-run — table re-copies instead of leaving the previous bytes in build/.
		// A FileTree rather than inputs.dir: the directory does not exist until the first run writes it, and a
		// missing DIRECTORY declared as an input is a validation failure while an empty file tree is not.
		inputs.files(fileTree(mcLineTables)).withPropertyName('mcLineTables')
		doFirst {
			logger.lifecycle("[forbric] mc-line ${mcLine}: resources come from src/main/resources with " +
					"${mcLineTables.name} overlaid (" + (mcLineTables.isDirectory()
							? "${fileTree(mcLineTables).files.size()} table file(s)" : "none committed yet") + ")")
		}
		doLast {
			if (!mcLineTables.isDirectory()) return
			File root = mcLineResources.get().asFile
			fileTree(mcLineTables).files.sort { it.path }.each { File table ->
				String relative = mcLineTables.toPath().relativize(table.toPath()).toString().replace(File.separator, '/')
				File target = new File(root, relative)
				target.parentFile.mkdirs()
				target.bytes = table.bytes
			}
		}
	}
	sourceSets.main.resources.setSrcDirs([])
	sourceSets.main.resources.srcDir(mcLineResources)
	tasks.named('processResources') { dependsOn normalizeBootResources }

	def lineCensusWrite = project.hasProperty('forbric.censusWrite')
	def lineCensus = tasks.register('lineCensus', Test) {
		group = 'verification'
		description = "Re-derives Minecraft ${mcLine}'s census tables from its own staged artifacts and checks them."
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		maxHeapSize = '1g'
		// The line, and the roots the producers resolve every jar through. `forbric.test.runtimeClasses` is
		// deliberately NOT set: TestFixtures.kernelGameSide() then answers with a path that does not exist, which is
		// what makes the two producers whose premise is the compiled game side SKIP here instead of scanning the
		// 26.2 classes a previous build left in build/classes/java/runtime.
		systemProperty 'forbric.censusLine', mcLine
		systemProperty 'forbric.stagedRoot', stagedRoot.absolutePath
		environment 'MC_DIR', mcLibraries.parentFile.absolutePath
		environment 'FORBRIC_OLD', stagedRoot.parentFile.absolutePath
		systemProperty 'java.awt.headless', 'true'
		// Exactly the eight producers, each by the tag it carries. Gradle fails a filtered Test task that discovers
		// no tests, so a producer that loses its tag turns into a build failure rather than a silent zero-run.
		useJUnitPlatform { includeTags 'census-table' }
		// A census is a MEASUREMENT: an up-to-date task would report the previous verdict on jars that have changed.
		outputs.upToDateWhen { false }
		testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat 'full' }
		if (lineCensusWrite) {
			// The writers. Each is the same code path with its comparison turned into a file write, and the file it
			// writes is this line's edition (TestFixtures.censusTableRoot).
			['CARRIER_RENAMES', 'CARRIER_HELPERS', 'LAMBDA_PERMUTATIONS', 'EARLY_RETURNS', 'CARRIER_TWINS',
					'CARRIER_STUBS', 'UNCALLED_METHODS', 'NATIVE_ONLY_METHODS'].each { name ->
				environment "FORBRIC_WRITE_${name}", '1'
			}
			// A regeneration pass disagrees with the file it has just replaced — the comparison reads the copy on the
			// classpath — so its failure is expected once, and the check is the SAME task without this switch.
			ignoreFailures = true
			doLast {
				logger.lifecycle("[forbric] census WRITE run for ${mcLine}: tables rewritten under " +
						"${mcLineTables}. A regeneration reports the OLD classpath copy as a mismatch by design; " +
						"run lineCensus again without -Pforbric.censusWrite to verify what it wrote.")
			}
		}
	}
	logger.lifecycle("[forbric] Minecraft line ${mcLine}: census tables are re-derived by :lineCensus from " +
			"${stagedMergedBase.name} and the carriers beside it")

	// ---------------------------------------------------------------------------------------------------
	// The line's fabric-api modules, remapped out of intermediary
	// ---------------------------------------------------------------------------------------------------
	//
	// fabric-api publishes its modules INTERMEDIARY-remapped: `ItemVariant.of(class_1799)`, `Storage`,
	// `ItemStorage.SIDED.find(Level, class_2338, class_2350)`. None of those Minecraft classes exists in this
	// line's jar, so no Mojmap source can read a fabric signature that mentions one -- measured as 8 "cannot
	// access class_XXXX / class file for ... not found" errors on the 1.21.1 kernel, plus the reason the one
	// genuine fabric rename (ContainerStorage -> InventoryStorage) could not be applied: substituting the name
	// would have turned three "cannot find symbol" errors into three "incompatible types" errors, same total
	// and the real gap hidden behind it.
	//
	// So the modules are rewritten before they are compiled against: class names, entry names, and the member
	// names that the table in src/runtime/mc-line/<line>-fabric-ns.tsv declares. The table is generated, not
	// guessed -- tools/namespace/join-keyed.py joins Fabric's intermediary tiny against Mojang's client
	// mappings on (owner, kind, obf name, obf descriptor) and covers the closure the modules need; a name it
	// does not have is reported by the task and fails the build rather than being left interstitial.
	//
	// STILL INTERMEDIARY, DELIBERATELY: the string-valued mixin selectors (@Inject(method = "..."), @At
	// target, @Shadow field names). fabric-api writes those in yarn names and translates them through a refmap
	// at runtime; they are inert for javac, and these jars are compile-time only -- the game side still links
	// against the fabric modules the pack installs, and nothing in build/transfer-api-mc is ever loaded.
	sourceSets.create('nsremap') {
		java { srcDir 'src/nsremap/java' }
	}
	dependencies {
		add('nsremapImplementation', "org.ow2.asm:asm:${project.asm_version}")
		add('nsremapImplementation', "org.ow2.asm:asm-commons:${project.asm_version}")
		add('nsremapImplementation', "org.ow2.asm:asm-tree:${project.asm_version}")
	}
	def nsremapReport = layout.buildDirectory.file("transfer-api-mc/${mcLine}-report.txt")
	def remapTransferApis = tasks.register('remapTransferApis', JavaExec) {
		group = 'build'
		description = "Rewrites the extracted fabric-api modules from Fabric intermediary to ${mcLine}'s own class names."
		dependsOn extractTransferApis
		classpath = sourceSets.nsremap.runtimeClasspath
		mainClass = 'net.forbric.nsremap.NamespaceRemapper'
		inputs.file(fabricNsTable).withPropertyName('fabricNamespaceTable')
		inputs.files(transferModuleFiles).withPropertyName('intermediaryModules')
		// The Mojmap jar the result is verified against, and the source of the class hierarchy the remapper
		// walks. Optional as an INPUT because a machine with no staged jars must still configure and fail
		// with a message rather than at snapshot time.
		inputs.files(file(stagedMergedBase)).withPropertyName('mojmapBase').optional()
		outputs.dir(remappedTransferDir)
		outputs.file(nsremapReport)
		doFirst {
			if (!fabricNsTable.isFile()) {
				throw new GradleException("Minecraft ${mcLine}'s fabric-api modules are intermediary-remapped and " +
						"need ${fabricNsTable} to be remapped to Mojmap, but it is absent. Generate it with " +
						"tools/namespace/join-keyed.py (see the header for its inputs), or pass " +
						"-Pforbric.mcLine=" + mcLineDefault + ".")
			}
			if (!stagedMergedBase.isFile()) {
				throw new GradleException("Remapping the fabric-api modules for ${mcLine} needs that line's " +
						"Mojmap jar to verify against and to read the class hierarchy from: ${stagedMergedBase} " +
						"does not exist. Run prepare for that line first.")
			}
			// The directory is entirely this task's output; a module that disappears upstream must not leave
			// its remapped jar behind for the classpath to pick up.
			remappedTransferDir.get().asFile.deleteDir()
			args = ['--table', fabricNsTable.absolutePath,
					'--base', stagedMergedBase.absolutePath,
					'--in', transferModulesDir.get().asFile.absolutePath,
					'--out', remappedTransferDir.get().asFile.absolutePath,
					'--report', nsremapReport.get().asFile.absolutePath]
		}
	}
	logger.lifecycle("[forbric] Minecraft line ${mcLine}: fabric-api modules are remapped to Mojmap before compiling")

	// -----------------------------------------------------------------------------------------------
	// The RUNTIME mapping table, produced by the same descriptor-keyed join and verified through the resolver
	// -----------------------------------------------------------------------------------------------
	//
	// net.forbric.kernel.fabric.KernelMappingResolver reads a pre-joined table from -Dforbric.mappings=<file>.
	// That table used to be written by tools/namespace/emit-table.ps1, which keys members by
	// (obfOwner, kind, obfName) -- a lossy key, because one obfuscated class reuses a short obf name across
	// descriptors. Against the merged base the table it wrote names something that is not at the stated
	// owner+signature 22,861 times, and maps 3,830 distinct intermediary members onto a single Mojmap member.
	// tools/namespace/join-keyed.py adds the descriptor AND the obf member name to the key: 78,922 of 78,922
	// members join with nothing ambiguous, and the table it writes resolves completely.
	//
	// THREE STEPS, EACH ITS OWN FAILURE MODE, and none of them is a file comparison:
	//   emitRuntimeMappings   runs the join. Its inputs are Mojang's own mapping files, which is why this cannot
	//                         be part of `check`: they are not in this repository and a fresh clone has none.
	//   auditRuntimeMappings  replays every record through the REAL resolver and fails if any answer differs from
	//                         the file. This is the step that catches a format the writer and the reader disagree
	//                         about -- measured: the two tables in this tree spell class names differently and the
	//                         same lookup answered slashed names from one and dotted names from the other, with no
	//                         error anywhere.
	//   verifyRuntimeMappings asks the game jars whether those answers name members that exist at the owner and
	//                         signature the intermediary declaration has. Anything absent from BOTH the merged base
	//                         and the unpatched Mojmap jar it was built from is a join defect and fails.
	//
	// The table is generated into build/, never committed: it is a derived view of Mojang mappings.
	def nsPython = project.findProperty('forbric.python')
			?: (System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
	def namespaceProbe = file(project.findProperty('forbric.namespaceProbe')
			?: (System.getenv('FORBRIC_NAMESPACE_PROBE') ?: 'E:\\project\\namespace-probe'))
	// The unpatched Mojmap jar the merged base is derived from. Its name carries no version and the staging
	// directory is shared with 26.2, so the verifier refuses it if its class-file major is not the base's.
	def namespaceOrigin = file(project.findProperty('forbric.namespaceOrigin')
			?: '.dev/minecraft/.forbric-build/clean-mojmap.jar')
	// This line's own merged base. It is now `stagedMergedBase` itself -- the top of this script names the base
	// per line, so the 26.2 literal that used to live there (and could hold EITHER line's bytes in a shared
	// staging directory, measured: under .dev/staged-1211/run the two names are byte-identical, both carrying
	// mc=1.21.1 pins) is gone. The fallback is kept only so this block still reads as what it is: a verifier that
	// will not silently adjudicate against a base that is not this line's.
	def lineMergedBase = stagedMergedBase
	def namespaceBase = lineMergedBase.isFile() ? lineMergedBase : stagedMergedBase
	def runtimeMappings = layout.buildDirectory.file("namespace/mappings-${mcLine}.tsv")
	def runtimeMappingsAnswers = layout.buildDirectory.file("namespace/mappings-${mcLine}-resolver-answers.tsv")
	def runtimeMappingsRejects = layout.buildDirectory.file("namespace/mappings-${mcLine}-unresolved.tsv")
	def joinScript = file('../tools/namespace/join-keyed.py')
	def verifyScript = file('../tools/namespace/verify-runtime-table.py')

	def emitRuntimeMappings = tasks.register('emitRuntimeMappings', Exec) {
		group = 'verification'
		description = "Joins Fabric intermediary to Mojmap for ${mcLine} into the table -Dforbric.mappings reads."
		inputs.file(joinScript).withPropertyName('joinScript')
		inputs.files(file(new File(namespaceProbe, 'tiny-extract/mappings.tiny')),
				file(new File(namespaceProbe, 'client-1.21.1.txt')))
				.withPropertyName('mojangMappings').optional()
		outputs.file(runtimeMappings)
		doFirst {
			def tiny = new File(namespaceProbe, 'tiny-extract/mappings.tiny')
			def client = new File(namespaceProbe, 'client-1.21.1.txt')
			if (!tiny.isFile() || !client.isFile()) {
				throw new GradleException("The runtime mapping table for ${mcLine} is a join of Fabric's intermediary " +
						"tiny and Mojang's client mappings, which are not in this repository (Mojang's cannot be " +
						"redistributed). Expected ${tiny} and ${client}; pass -Pforbric.namespaceProbe=<dir> or set " +
						"FORBRIC_NAMESPACE_PROBE. See the header of tools/namespace/join-keyed.py.")
			}
			runtimeMappings.get().asFile.parentFile.mkdirs()
			commandLine([nsPython, joinScript.absolutePath, runtimeMappings.get().asFile.absolutePath, '--full']
					.collect { it.toString() })
			if (project.hasProperty('forbric.namespaceProbe')) {
				environment 'FORBRIC_NAMESPACE_PROBE', namespaceProbe.absolutePath
			}
		}
	}

	def auditRuntimeMappings = tasks.register('auditRuntimeMappings', JavaExec) {
		group = 'verification'
		description = "Replays every table record through KernelMappingResolver and fails if an answer differs."
		dependsOn tasks.named('classes'), emitRuntimeMappings
		classpath = sourceSets.main.runtimeClasspath
		mainClass = 'net.forbric.kernel.fabric.MappingTableAudit'
		// Declared as inputs so a regenerated table re-runs the audit instead of leaving it up to date against
		// the previous answer set -- the same trap the `test` task documents for the game-side classes.
		inputs.file(runtimeMappings).withPropertyName('runtimeMappings')
		outputs.file(runtimeMappingsAnswers)
		doFirst {
			def table = runtimeMappings.get().asFile
			systemProperty 'forbric.mappings', table.absolutePath
			args = ['--table', table.absolutePath,
					'--answers', runtimeMappingsAnswers.get().asFile.absolutePath]
		}
	}

	tasks.register('verifyRuntimeMappings', Exec) {
		group = 'verification'
		description = "Adjudicates the resolver's answers for ${mcLine} against the merged base and its unpatched origin."
		dependsOn auditRuntimeMappings
		inputs.file(runtimeMappingsAnswers).withPropertyName('resolverAnswers')
		inputs.files(namespaceBase).withPropertyName('mergedBase').optional()
		inputs.files(namespaceOrigin).withPropertyName('unpatchedOrigin').optional()
		outputs.file(runtimeMappingsRejects)
		doFirst {
			if (!namespaceBase.isFile()) {
				throw new GradleException("Verifying the ${mcLine} mapping table needs that line's merged base " +
						"(${namespaceBase}) to check the answers against. Run prepare for that line first.")
			}
			// The .pins sidecar is how an artifact says which line it is; the staging directory is shared and its
			// filenames are not. A base from the other line would adjudicate every answer against the wrong game
			// and the output would look like a mapping defect.
			def pins = file("${namespaceBase}.pins")
			if (pins.isFile()) {
				def claim = pins.getText('UTF-8')
				if (!claim.contains("mc=${mcLine}")) {
					throw new GradleException("${namespaceBase} says it is not ${mcLine}: ${claim}. The staging " +
							"directory is shared between lines and an unversioned filename can hold either line's " +
							"bytes; refusing to verify a mapping table against the wrong game.")
				}
			}
			if (!namespaceOrigin.isFile()) {
				throw new GradleException("Verifying the ${mcLine} mapping table needs the UNPATCHED Mojmap jar " +
						"the merged base was built from, to tell a patching difference apart from a wrong mapping: " +
						"${namespaceOrigin} does not exist. Pass -Pforbric.namespaceOrigin=<jar>.")
			}
			commandLine([nsPython, verifyScript.absolutePath,
					'--table', runtimeMappings.get().asFile.absolutePath,
					'--answers', runtimeMappingsAnswers.get().asFile.absolutePath,
					'--base', namespaceBase.absolutePath,
					'--origin', namespaceOrigin.absolutePath,
					'--label', mcLine,
					'--rejects', runtimeMappingsRejects.get().asFile.absolutePath].collect { it.toString() })
			if (project.hasProperty('forbric.namespaceProbe')) {
				environment 'FORBRIC_NAMESPACE_PROBE', namespaceProbe.absolutePath
			}
		}
	}
}

repositories {
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	mavenCentral()
}

configurations {
	// runtime source set inherits the boot-side library deps (asm etc.) for compilation.
	runtimeImplementation.extendsFrom implementation
	runtimeCompileOnly.extendsFrom compileOnly
	// MixinExtras — JiJ-nested into the runtime jar (game-side), never parent-loaded (LocalRef generated-class law).
	nestedMods
	transferTestImplementation.extendsFrom testImplementation
	transferTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	compileOnly 'org.jetbrains:annotations:23.0.0'
	// log4j-api is provided by Minecraft at runtime; boot-side diagnostics link against it compileOnly and fall
	// back to System.err when absent (unit tests, --scan tooling).
	compileOnly 'org.apache.logging.log4j:log4j-api:2.24.3'

	// --- Pure-bytecode / mapping / data machinery (same coordinates as the substrate) ---
	api "org.ow2.asm:asm:${project.asm_version}"
	api "org.ow2.asm:asm-analysis:${project.asm_version}"
	api "org.ow2.asm:asm-commons:${project.asm_version}"
	api "org.ow2.asm:asm-tree:${project.asm_version}"
	api "org.ow2.asm:asm-util:${project.asm_version}"
	api "net.fabricmc:sponge-mixin:${project.mixin_version}"
	api "org.ow2.sat4j:org.ow2.sat4j.core:${project.sat4j_version}"
	api "org.ow2.sat4j:org.ow2.sat4j.pb:${project.sat4j_version}"
	api "net.fabricmc:tiny-remapper:${project.tiny_remapper_version}"
	api "net.fabricmc:class-tweaker:${project.class_tweaker_version}"
	api "net.fabricmc:mapping-io:${project.mapping_io_version}"

	// The merge tools see ASM and nothing else -- the same artifacts run/build-merged-base.sh puts on javac's
	// classpath when it compiles them by hand. Deliberately `toolsImplementation` and not `api`: what
	// mergeToolsJar shades is exactly this list, so an accidental extra dependency shows up as a bigger jar
	// rather than as a NoClassDefFoundError in the installer's subprocess.
	toolsImplementation "org.ow2.asm:asm:${project.asm_version}"
	toolsImplementation "org.ow2.asm:asm-commons:${project.asm_version}"
	toolsImplementation "org.ow2.asm:asm-tree:${project.asm_version}"

	// The tests read the TOOL classes too: net.forbric.tools.LostHookAttribution parses the tracked merge report,
	// and the census over it (MergeCoverageCensusTest) is a test like any other. Without this the tool classes are
	// only reachable from the shaded jar, so a test that judges the merge could not be written where the tests run.
	testImplementation sourceSets.tools.output

	nestedMods "io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"
	// The game side names MixinExtras' Operation (KernelWrapOperations); the game supplies the nested copy above.
	runtimeCompileOnly "io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"

	// TOML (mods.toml) + JSON (fabric.mod.json) readers — same libs the ecosystems use.
	api "com.electronwill.night-config:core:${project.night_config_version}"
	api "com.electronwill.night-config:toml:${project.night_config_version}"
	api "com.electronwill.night-config:json:${project.night_config_version}"

	// fastutil, for the GAME side only. ParticleResources' vanilla-typed `providers` field is an Int2ObjectMap,
	// and KernelParticleProviders has to hand it one. None of the three staged artifacts carries fastutil (zero
	// it/unimi entries in any of them) — Minecraft supplies it at runtime, exactly like brigadier. Pinned from
	// Maven rather than picked out of the local launcher's library tree, which holds several versions and would
	// make the runtime set's classpath a function of what that launcher happened to cache. compileOnly, never
	// bundled, and never resolved on a machine with no staged jars: compileRuntimeJava is already skipped there.
	runtimeCompileOnly 'it.unimi.dsi:fastutil:8.5.18'

	// Guava, GAME side only, for the same reason and on the same terms as fastutil: several vanilla signatures
	// return com.google.common.collect.ImmutableList (StateDefinition.getPossibleStates among them), so javac
	// cannot read those methods without it. Minecraft supplies it at runtime; the kernel never ships it. Pinned
	// from Maven rather than the local launcher's tree, which holds three versions here — any of them satisfies
	// javac's need to READ the class files, which is all this is for, so the pin is about reproducibility.
	runtimeCompileOnly 'com.google.guava:guava:33.6.0-jre'

	// JOML, GAME side only, on the same terms: fog data carries its colour as a Vector4f, and the MinecraftForge fog
	// event KernelGameClientEvents posts takes it. Pinned to the version Minecraft 26.2 lists.
	runtimeCompileOnly('org.joml:joml:1.10.8') { transitive = false }

	testImplementation "org.junit.jupiter:junit-jupiter:${project.junit_version}"
	// Compiled against too: FixturePolicyExtensionTest launches a nested run to prove the suite loads its extension.
	testImplementation 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

// The GAME-side set only compiles when the staged jars exist. Point developers at the pipeline otherwise.
tasks.named('compileRuntimeJava') {
	onlyIf {
		if (stagedGameJars.isEmpty()) {
			logger.lifecycle('compileRuntimeJava: SKIPPED — staged game jars absent. Run prepareDev first ' +
						'(or python3 ../tools/dev.py prepare), then build in a second invocation.')
			return false
		}
		return true
	}
	// Here rather than in extractTransferApis: with no jar that task has no source, and Gradle skips it unrun.
	doFirst {
		if (stagedGameJars.size() != 3) throw new GradleException("Incomplete staged game inputs: "
				+ stagedGameJars.size() + "/3 under ${stagedRoot}. Run prepareDev before building the game side.")
		if (!stagedFabricApi.isFile()) throw new GradleException("The kernel game side includes its transfer " +
				"component and compiles it against Fabric API's transfer modules, but ${stagedFabricApi} does not " +
				"exist. Pass -Pforbric.fabricApi=<a fabric-api jar for 26.2> (the compatibility pack's is the default).")
	}
}
// No outputs, so never up to date: it runs whenever the game side is built.
def energyApiContract = file('src/main/resources/net/forbric/kernel/interop/protocol/energy.api-contract.txt')
def verifyRebornEnergy = tasks.register('verifyRebornEnergy', JavaExec) {
	description = 'Checks the energy adapter public binary API, independent of jar version or implementation hash.'
	onlyIf { !stagedGameJars.isEmpty() }
	dependsOn tasks.named('classes'), extractTransferApis
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'net.forbric.kernel.metadata.ApiJarContract'
	inputs.file(energyApiContract).withPropertyName('energyApiContract')
	// The ABI check runs on the artifact the compile ALSO uses, so "the bytes javac reads" and "the bytes the contract
	// verified" are the same file by construction -- on 1.21.1 that is the build-produced class-65 edition.
	inputs.files(energyForLine).withPropertyName('energyApiImplementation').optional()
	doFirst {
		if (!energyForLineFile.isFile()) throw new GradleException("The energy adapter needs a jar exposing its public API: " +
				energyForLineFile + ". Pass -Pforbric.rebornEnergy=<compatible energy API jar>.")
		setArgs([energyApiContract.absolutePath, energyForLineFile.absolutePath] +
				transferModuleFiles.files.collect { it.absolutePath })
	}
}
tasks.named('compileRuntimeJava') { dependsOn verifyRebornEnergy }
// Links against the game side, so it is built exactly when the game side is.
tasks.named('compileModMenuApiJava') {
	onlyIf { !stagedGameJars.isEmpty() }
}

test {
	useJUnitPlatform()
	// Gradle's default test-worker heap is 512 MB. Several staged tests hold the whole merged base in memory
	// (ForgeCapabilityProtocolTest, ModifiableDataViewsTransformerTest, ForgeCapabilityTokenInjectorExecutionTest,
	// FurnaceTickCallsInjectorTest: 480-509 MB live, measured with -Xlog:gc), so the default left a few MB of headroom
	// and a G1 humongous allocation after an unrelated test could end the worker with OutOfMemoryError.
	maxHeapSize = '1g'
	// Transport proofs need the new hash-indexed base; an old base is an explicit negative control.
	def predicateBase = file(project.findProperty('forbric.predicateBase') ?: stagedMergedBase)
	inputs.files(predicateBase).withPropertyName('predicateNativeBase').optional()
	systemProperty 'forbric.predicateBase', predicateBase.absolutePath
	// Optional final-definition evidence lets the staged source-continuation test replay a real weave.
	def sharedFinalDefined = project.findProperty('forbric.sharedFinalDefined')
	if (sharedFinalDefined != null) {
		def definitions = file(sharedFinalDefined)
		inputs.files(fileTree(definitions)).withPropertyName('sharedFinalDefined').optional()
		systemProperty 'forbric.sharedFinalDefined', definitions.absolutePath
	}
	// These integration fixtures read the released Create Fly jar, so replacing it must invalidate the tests. A
	// file collection, not inputs.file: a fresh clone (and CI) has no such jar, and the tests skip without it.
	def createFlyFixture = file(project.findProperty('forbric.createFlyJar')
			?: 'build/compat-inputs/create-fly/create-fly.jar')
	inputs.files(createFlyFixture).withPropertyName('createFlyFixture').optional()
	systemProperty 'forbric.createFlyJar', createFlyFixture.absolutePath
	// Only EventChainAuditTest's own loader gets log4j (the real buses need it); the test classpath keeps none,
	// because several tests assert ForbricLog's fallback when log4j is absent.
	doFirst { systemProperty 'forbric.log4jApiForTests', configurations.compileClasspath.files.find { it.name.startsWith('log4j-api-') }?.absolutePath ?: '' }
	// Game-side tests that name MixinExtras (KernelWrapOperationsTest) load it beside build/classes/java/runtime.
	doFirst { systemProperty 'forbric.mixinExtrasForTests', configurations.nestedMods.files.find { it.name.startsWith('mixinextras-') }?.absolutePath ?: '' }
	// The real-Mixin weave harness (net.forbric.kernel.mixin.weave) runs each bootstrap in a child JVM on this
	// classpath, because Mixin's bootstrap is one-shot per JVM. Its fixtures include the mixin-outcome canary's
	// sources, read in place, so editing that canary must re-run the tests.
	doFirst { systemProperty 'forbric.weaveHarnessClasspath', sourceSets.test.runtimeClasspath.asPath }
	inputs.files(fileTree('canary/mixin-outcome')).withPropertyName('weaveCanaries')
	// Component/decision tests do not own macOS's first UI thread. Actual windows are exercised
	// by the separately forked dialog/client gates, not by the Gradle worker's AppKit instance.
	systemProperty 'java.awt.headless', 'true'
	// The GAME-side output is an INPUT to these tests, and Gradle cannot see that on its own.
	//
	// Several tests load src/runtime classes through a URLClassLoader over build/classes/java/runtime -- it is the
	// only way to drive game-side code off-game, and it is a file path rather than a declared dependency. So
	// `test` was UP-TO-DATE after a runtime-source edit: the suite reported green against the PREVIOUS compile,
	// and a mutation check on any of those classes silently proved nothing. That trap is written down in the wall
	// ledger from the last time it cost a day; this is the fix rather than the note.
	dependsOn tasks.named('compileRuntimeJava')
	inputs.files(sourceSets.runtime.output).withPropertyName('gameSideClasses').optional()
	// The same for the Mod Menu API stand-in, which ModMenuApiStandInShapeTest reads off build/classes/java/modMenuApi.
	dependsOn tasks.named('compileModMenuApiJava')
	inputs.files(sourceSets.modMenuApi.output).withPropertyName('modMenuApiStandIn').optional()
	// NoRawAssumptionsTest reads the test sources and its allowlist as TEXT. An allowlist edit changes no class, so
	// without these the task stayed UP-TO-DATE and kept the verdict on the previous list.
	inputs.file('src/test/raw-assumption-allowlist.txt').withPropertyName('rawAssumptionAllowlist')
	inputs.files(fileTree('src/test/java'), fileTree('src/transferTest/java')).withPropertyName('testSourceText')
	// ProcessBuilder tests execute these files; their edits must invalidate the test task too.
	inputs.files(fileTree('run/compat') { include '**/*.py', '**/*.sh', '**/*.md' })
			.withPropertyName('compatibilityTools').optional()
	inputs.files(fileTree('run') { include 'gate-m*.sh', 'lib.sh' })
			.withPropertyName('gateContracts').optional()
	inputs.files(fileTree(stagedRoot) {
		include 'build-testmods.sh', 'livemod-src/**', 'livemod-src-neoforge/**',
				'forge-runtime/forbriclive.jar', 'neoforge-runtime/forbricneolive.jar'
	}).withPropertyName('compatibilityCanaries').optional()
	inputs.files(fileTree('build/compat-inputs') { include '**/mods/*.jar' })
			.withPropertyName('compatibilityModFixtures').optional()
	// The merged game the real-bytecode tests read. Without this, rebuilding it leaves the test task UP-TO-DATE
	// and every one of those tests silently keeps its previous verdict — which is exactly what happened the
	// first time the base was rebuilt: a green run that had not looked at the new jar at all.
	//
	// Through stagedRoot, NOT the literal path: these three lines hardcoded '../forbric-loader/run/...' while
	// the variable that honours FORBRIC_OLD was declared thirty lines up and already used by the canary inputs.
	// On a second worktree -- the one configuration FORBRIC_OLD exists for -- the declared input was a file that
	// does not exist, so rebuilding the real merged base left `test` UP-TO-DATE and every bytecode test kept its
	// previous verdict. That is the exact failure these lines were added to prevent, reintroduced by the knob
	// meant to support the case.
	inputs.files(files(stagedMergedBase))
			.withPropertyName('mergedBase').optional()
	// The two carriers, for exactly the same reason, one artifact over. About twenty test classes read them --
	// ForeignTypeCarrierTest checks every ForeignType name against them, CarrierAccessTransformerTest reads the
	// real AT out of them -- and none of that was declared. So a carrier upgrade, which is the single event those
	// tests exist to catch, left `test` UP-TO-DATE and every one of them silently kept its previous verdict.
	inputs.files(files(stagedForgeRuntime))
			.withPropertyName('forgeCarrier').optional()
	inputs.files(files(stagedNeoRuntime))
			.withPropertyName('neoforgeCarrier').optional()
	// The bytecode tests find the staged jars themselves, through FORBRIC_OLD, so hand them the root this build
	// compiled against: `$FORBRIC_OLD/run` IS this build's staged root. StagedRootHandoffTest asserts exactly
	// that identity, and it is what keeps a -Pforbric.stagedRoot override from moving the compile while leaving
	// every test reading another base.
	//
	// This used to be overridden to the repository root to make `run/lib.sh` reachable, which broke the identity
	// while fixing the symptom: with the default staged root inside this project's own run/, the two are the
	// same directory and no override is needed. See the default's comment for why it has to be that directory.
	environment 'FORBRIC_OLD', stagedRoot.parentFile.absolutePath
	systemProperty 'forbric.stagedRoot', stagedRoot.absolutePath
	// The same for Minecraft's own jar and libraries (TestFixtures.minecraftDir): the directory the game side compiled
	// against, so a prepared .dev/minecraft or -Pforbric.mcLibraries reaches the tests instead of a platform default.
	environment 'MC_DIR', mcLibraries.parentFile.absolutePath
	systemProperty 'forbric.fabricApi', stagedFabricApi.absolutePath
	// Refused when the tests RUN, never while the build is configured: this block configures every invocation,
	// and a root that does not exist is the documented way to build the boot jar as a machine without staged
	// artifacts would (above). run/test-staged-root.sh checks both halves.
	doFirst {
		if (stagedRoot.name != 'run') throw new GradleException("forbric.stagedRoot must name a run/ directory, as"
				+ " FORBRIC_OLD/run does: the tests resolve FORBRIC_OLD + '/run'. Got ${stagedRoot}")
	}
	// No unit test may fork a window. DependencyAuditTest drives DependencyAudit.report with Side.CLIENT and
	// deliberately unmet requirements, which is exactly the input that opens one -- and a test suite that stops
	// on an invisible dialog looks like a hang, not a failure. DependencyDialogTest drives the fork itself, with
	// its own explicit flags, so it does not need this to be on.
	systemProperty 'forbric.dependencyDialog', 'off'
}

// The engine tests need the whole game side. Without staged game jars they are skipped and say so, except in an
// integration run, where -Pforbric.requireTransfer=true turns that skip into a failure.
def transferSuiteRuns = { String task ->
	if (stagedGameJars.size() == 3 || requireTransfer) return true
	logger.lifecycle("${task}: SKIPPED — staged game jars absent (${stagedGameJars.size()}/3 under ${stagedRoot})")
	return false
}
tasks.named('compileTransferTestJava') {
	onlyIf { transferSuiteRuns('compileTransferTestJava') }
	// Thrown from an action, not from onlyIf, where Gradle would bury the message under "could not evaluate spec".
	doFirst {
		if (stagedGameJars.size() != 3) throw new GradleException("The staged game jars are absent (" +
				"${stagedGameJars.size()}/3 under ${stagedRoot}), and -Pforbric.requireTransfer=true forbids skipping " +
				"the transfer engine tests")
	}
}
tasks.register('transferTest', Test) {
	description = 'Exercises transfer conservation and nested rollback using the real Fabric/NeoForge transaction engines.'
	// The Reborn jar is on this classpath at RUN time too; an up-to-date compile does not re-check it.
	dependsOn verifyRebornEnergy
	onlyIf { transferSuiteRuns('transferTest') }
	testClassesDirs = sourceSets.transferTest.output.classesDirs
	classpath = sourceSets.transferTest.runtimeClasspath
	useJUnitPlatform()
	// Resolved at execution, NOT configuration. The classpath includes the extracted API modules, and read at
	// configuration time on a clean build directory that glob is still empty: every scenario then failed with
	// NoClassDefFoundError on the first run after `clean` and passed on the second.
	doFirst { systemProperty 'forbric.transferTestClasspath', classpath.asPath }
	// Without Minecraft's own library set every scenario fails on a ClassNotFoundException for a netty or Commons
	// Lang class, which reads as a transfer bug. Say what is missing instead. A run narrowed with --tests may be
	// after a scenario that needs none of it, so that one only warns.
	doFirst {
		def problem = !stagedMcVersionJson.isFile()
				? "${stagedMcVersionJson} is absent, so Minecraft 26.2's library list is unknown"
				: !missingTransferTestLibraries.isEmpty()
						? "${missingTransferTestLibraries.size()} of the libraries ${stagedMcVersionJson} lists are not under " +
								"${mcLibraries}: ${missingTransferTestLibraries.take(5).join(', ')}"
						: null
		if (problem == null) return
		def advice = "Point -Pforbric.mcLibraries or MC_DIR at a Minecraft install that has run 26.2, or run " +
				"`python tools/dev.py prepare`"
		if (filter.commandLineIncludePatterns.isEmpty()) throw new GradleException("The transfer suite needs Minecraft's " +
				"own libraries: ${problem}. ${advice}")
		logger.warn("[forbric] transferTest: ${problem}; a scenario that loads Minecraft classes will fail. ${advice}")
	}
}
tasks.named('check') { dependsOn tasks.named('transferTest') }

// BOOT jar: parent-loaded kernel core (classloading, discovery, resolve, transform, mixin service, mapping, access,
// metadata, vendored fabric api surface). No game types.
//
// MixinExtras rides along under META-INF/jars. It must NOT be parent-loaded (the LocalRef generated-class law: its
// generated classes must share the game's loader), so the boot orchestrator extracts it and hands it to
// ForbricClassLoader as an owned jar. Bundling keeps the kernel self-sufficient — no launcher-supplied path.
jar {
	archiveBaseName = 'forbric-kernel'
	into('META-INF/jars') {
		from configurations.nestedMods
		rename '.*\\.jar', 'mixinextras-fabric.jar'
	}
	// The boot-side dependencies are SHADED IN, so the kernel jar needs nothing from the launcher's classpath.
	//
	// Declaring them `api` and staging them into the install profile is not enough, and a real launch proved
	// it: PCL CE put only the six net.forbric entries on the classpath and left the fourteen here off it —
	// they were in the profile, present on disk, and still absent from the generated launch script — so the
	// game died on "NoClassDefFoundError: org/objectweb/asm/ClassVisitor" at KernelClientLaunch before it
	// could start. dev.py compensates for exactly this; the install path cannot, because it does not own the
	// classpath.
	//
	// SPONGE-MIXIN IS EXCLUDED, and that exclusion is the point of this comment. The first version of this
	// shade took the whole runtimeClasspath, sponge-mixin included, and a real launch showed what that costs:
	//
	//   6 kernel class(es) could not be defined up front and will be read on first use:
	//     [org.spongepowered.asm.launch.MixinTweaker (java.lang.NoClassDefFoundError: net/minecraft/launch...)]
	//   MixinInitialisationError: ... JAVA_25 could not be set.
	//     Level is not supported by the active JRE or ASM version (Java 25.0, ASM 9.0 (ASM10_EXPERIMENTAL))
	//
	// MixinTweaker references GAME classes, so it cannot be defined by the parent loader at all — the same law
	// the MixinExtras note above records, applied to the other mixin artifact. Shading it put a class in the
	// boot jar that the boot loader is structurally unable to load, and left the mixin runtime reading a
	// compatibility level off the copy it found there instead of the one the game loader supplies.
	//
	// ASM is a plain library — javac does not resolve a single game type through it — so it stays. So do
	// mapping-io, tiny-remapper, class-tweaker, sat4j and night-config. What is left out is the artifact that
	// has to live with the game's loader, not the artifact that reads class files.
	//
	// Filtering to .jar files keeps the kernel's own build/classes and build/resources out; those are already
	// in via sourceSets.
	from {
		configurations.runtimeClasspath.files
				.findAll { it.isFile() && it.name.endsWith('.jar') && !it.name.startsWith('sponge-mixin-') }
				.collect { zipTree(it) }
	}
	// A shaded dependency's own jar metadata is meaningless once repacked and fatal if kept: signatures make
	// the JVM reject a changed jar, and one library's module-info would describe only that library. Same
	// excludes mergeToolsJar uses, for the same reasons.
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
	exclude 'META-INF/MANIFEST.MF', 'META-INF/versions/**/module-info.class', 'module-info.class'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// GAME jar: forbric-kernel-runtime — the half ForbricClassLoader defines, compiled against the staged jars.
//
// It does NOT nest MixinExtras. The boot jar above already carries it and KernelBundledJars extracts it; a
// second copy here would ride inside an owned jar where nothing reads nested jars, so it would be a megabyte of
// dead weight AND a second place to update when the version moves. One bundler owns it.
tasks.register('runtimeJar', Jar) {
	archiveBaseName = 'forbric-kernel-runtime'
	dependsOn 'compileRuntimeJava'
	from sourceSets.runtime.output
	// Mod Menu's API stand-in, as bytes under META-INF and under a name no class loader resolves: see the modMenuApi
	// source set and ModMenuApiStandIn, which reads them from here.
	from(sourceSets.modMenuApi.output.classesDirs) {
		include '**/*.class'
		into 'META-INF/forbric/modmenu-api'
		rename { String file -> file + '.bin' }
	}
	// The boot seam requires exactly these three when the transfer APIs are installed; a jar without them is a
	// release that turns every fabric-api pack into a required loss. Checked on the artifact itself.
	doLast {
		def entries = new java.util.zip.ZipFile(archiveFile.get().asFile).withCloseable { zip -> Collections.list(zip.entries())*.name as Set }
		// The stand-in is there, and only as resources. A loadable com/terraformersmc class in this jar would be
		// defined ahead of a real Mod Menu's and break every mod that uses more of Mod Menu than its API.
		def loadable = entries.findAll { it.startsWith('com/terraformersmc/') }
		if (loadable) throw new GradleException("forbric-kernel-runtime.jar must not carry Mod Menu classes as classes: ${loadable.take(3)}")
		def standIn = ['api/ModMenuApi', 'api/ConfigScreenFactory', 'api/UpdateChecker', 'api/UpdateInfo', 'api/UpdateChannel',
				'util/NullScreenFactory']
				.collect { "META-INF/forbric/modmenu-api/com/terraformersmc/modmenu/${it}.class.bin".toString() }
				.findAll { !entries.contains(it) }
		if (standIn) throw new GradleException("forbric-kernel-runtime.jar was built without its Mod Menu API stand-in: ${standIn}")
		def missing = ['BlockTransferBridge', 'TransferIssues', 'PairedTransactions', 'RebornEnergyBridge',
				'RebornEnergyAdapters', 'ForgeEnergyAdapters', 'EnergyUnits']
				.collect { "net/forbric/kernel/runtime/transfer/${it}.class".toString() }.findAll { !entries.contains(it) }
		if (missing) throw new GradleException("forbric-kernel-runtime.jar was built without its transfer component: ${missing}")
		// Team Reborn Energy is the player's mod, compiled against and never shipped.
		def bundled = entries.findAll { it.startsWith('team/reborn/') }
		if (bundled) throw new GradleException("forbric-kernel-runtime.jar must not bundle Team Reborn Energy: ${bundled.take(3)}")
	}
}

// Carry the game-side jar INSIDE the boot jar, next to MixinExtras and delivered the same way — so the kernel
// stays one file and neither a launcher nor the installer has to learn a new path.
//
// Wired at CONFIGURATION time and only when the staged jars are present. That is the whole reason this is an
// `if` and not an `onlyIf`: `onlyIf` skips the task but keeps the wiring, so a machine without staged artifacts
// would still get an `into` block sourced from a jar that was never built — which packs an EMPTY runtime jar,
// and an empty one is worse than none at all (every game-side class then fails to link at the moment of use,
// far from the cause). With the wiring itself absent, `gradlew jar` on such a machine is byte-identical to what
// it was before this block existed, and the boot-side gate is untouched.
//
// Nothing is lost there either: this jar links against Mojang/Forge/Neo types, so a machine that cannot build
// it also cannot run the game that would load it. Its prerequisites ARE the game's prerequisites.
//
// This is a SIBLING of the MixinExtras block on purpose. `rename` is a property of the CopySpec it sits in, so
// putting this `from` inside that block would rename the runtime jar to mixinextras-fabric.jar and silently
// replace the wrong file.
if (!stagedGameJars.isEmpty()) {
	jar {
		dependsOn 'runtimeJar'
		into('META-INF/jars') {
			from tasks.named('runtimeJar').flatMap { it.archiveFile }
			rename '.*\\.jar', 'forbric-kernel-runtime.jar'
		}
	}
}

// Emits the boot-side runtime classpath so launch scripts can compose it with the game classpath.
tasks.register('printBootClasspath') {
	doLast { println sourceSets.main.runtimeClasspath.asPath }
}

// The merge-tools jar: net.forbric.tools shaded with the ASM it needs, plus the reviewed link-check baseline.
// The installer ships it as a resource and runs it as a subprocess (4 GB heap, which the installer's JVM cannot
// grant itself), and run/build-merged-base.sh invokes it directly.
//
// Deliberately NOT wired into `assemble`: building it resolves ASM and shades it, and the two things that want
// it -- forbric-kernel-installer's buildMergeTools task and anyone reproducing run/build-merged-base.sh -- ask
// for it by name. `jar` stays the fast, dependency-light boot jar.
tasks.register('mergeToolsJar', Jar) {
	group = 'build'
	description = 'Build the merge-tools jar (net.forbric.tools + shaded ASM) that produces the staged game artifacts.'
	archiveBaseName = 'forbric-merge-tools'
	// sourceSets.tools.output already carries BOTH the compiled tool classes and the baseline resource
	// (src/tools/resources/net/forbric/tools/link-check-baseline.txt, which is what the tools load from their
	// own classpath). Naming the resource separately as well made it a duplicate entry.
	from sourceSets.tools.output
	from { configurations.toolsRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
	// ASM's own jar metadata: signatures (meaningless once repacked, and fatal if kept -- the JVM rejects a
	// signed entry whose jar has changed), module descriptors (this is a classpath jar, and a module-info from
	// one shaded library would describe only that library), and index/manifest files.
	exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
	exclude 'META-INF/MANIFEST.MF', 'META-INF/versions/**/module-info.class', 'module-info.class'
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Development workflow. Preparation runs in a separate invocation because runtime wiring is configured above.
def devDriver = file('../tools/dev.py')
def devPython = project.findProperty('forbric.python') ?: (osName.contains('windows') ? 'python' : 'python3')
tasks.register('prepareDev', Exec) {
	group = 'development'
	description = 'Download and assemble isolated development game inputs using the installer pipeline.'
	workingDir projectDir.parentFile
	commandLine devPython, devDriver, 'prepare', '--java', System.getProperty('java.home')
	// The canary mods take sponge-mixin and ASM from this classpath; without it dev.py would start a second build here.
	doFirst { environment 'FORBRIC_KERNEL_CLASSPATH', sourceSets.main.runtimeClasspath.asPath }
}
tasks.register('devDoctor', Exec) {
	group = 'development'
	description = 'Read-only development prerequisite check; exit 2 means preparation is needed.'
	workingDir projectDir.parentFile
	commandLine devPython, devDriver, 'doctor', '--java', System.getProperty('java.home')
}
tasks.register('toolTest', Exec) {
	group = 'verification'
	description = 'Run portable development and compatibility tooling self-tests without staged game jars.'
	workingDir projectDir.parentFile
	commandLine devPython, devDriver, 'tool-test'
}
tasks.named('check') { dependsOn 'toolTest' }
tasks.register('linkToolTest', Exec) {
	group = 'verification'
	description = 'Run the installer packaged-link-gate tests on synthetic jars, without game inputs or bootstrap.'
	workingDir file('../forbric-kernel-installer')
	commandLine(osName.contains('windows') ? ['cmd', '/d', '/c', 'gradlew.bat', 'linkGateTest'] : ['./gradlew', 'linkGateTest'])
}
tasks.named('check') { dependsOn 'linkToolTest' }
// The suites whose tests ran in THIS invocation. Results left by an earlier invocation are not evidence.
def executedSuites = Collections.synchronizedSet(new HashSet<String>())
// Fixture file names are Unicode ("[钠] sodium-fabric-….jar"). A JVM started under the C/POSIX locale cannot encode
// them and throws InvalidPathException; minimal Linux images and containers start there. tools/dev.py never saw it
// because Python coerces that locale for its children, but a plain ./gradlew does not.
def inheritedLocale = ['LC_ALL', 'LC_CTYPE', 'LANG'].collect { System.getenv(it) }.find { it }
def utf8TestLocale = osName.contains('linux') && !(inheritedLocale ==~ /(?i).*utf-?8.*/)
// The gate/contract suites shell out to `bash` by name (e.g. `new ProcessBuilder("bash", "-n", gate)` and
// `bash -c ". run/lib.sh ..."`). On Linux that resolves from PATH; on Windows a Git-for-Windows install keeps
// bash in its own directory, which is deliberately NOT added to PATH system-wide. Without this the whole
// suite dies with `CreateProcess error=2` before it judges a single gate -- 8 test classes on a Windows
// checkout, reporting an environmental absence as if every gate were broken. CI never sees it because it only
// runs ubuntu-latest.
//
// Only an EXISTING directory is appended, so nothing invented reaches a child process; and a machine that
// already has bash on PATH is left exactly as it is (its own bash wins, since this is appended, not prepended).
def windowsBashDirs = !osName.contains('windows') ? [] : [
		'C:\\Program Files\\Git\\bin',
		'C:\\Program Files\\Git\\usr\\bin',
		'C:\\Program Files (x86)\\Git\\bin'].collect { new File(it) }.findAll { it.isDirectory() }
tasks.withType(Test).configureEach {
	def suiteName = name
	if (utf8TestLocale) environment 'LC_ALL', 'C.UTF-8'
	def pathEnvKey = System.getenv().find { k, v -> k.equalsIgnoreCase('PATH') }?.key
	if (pathEnvKey != null) {
		def existing = System.getenv(pathEnvKey)
		def alreadyOnPath = windowsBashDirs.isEmpty() || windowsBashDirs.any { dir ->
			existing.split(File.pathSeparator).any { it.trim().equalsIgnoreCase(dir.absolutePath) }
		}
		if (!alreadyOnPath) {
			environment pathEnvKey, existing + File.pathSeparator + windowsBashDirs*.absolutePath.join(File.pathSeparator)
			logger.lifecycle("[forbric] ${suiteName}: bash is not on PATH; appended ${windowsBashDirs*.absolutePath.join(', ')} "
					+ "so the gate/contract suites can run (they invoke bash by name)")
		}
	}
	inputs.property('strictIntegration', strictIntegration)
	inputs.property('skipBaseline', skipBaseline ?: '')
	// The fixtures whose absence fails instead of skipping (TestFixtures.Fixture ids, or 'all'), read by
	// TestFixtures and FixturePolicyExtension. An integration run requires all of them, at the test that skipped
	// rather than only in the totals afterwards.
	systemProperty 'forbric.requireFixtures', project.findProperty('forbric.requireFixtures') ?: (strictIntegration ? 'all' : '')
	// A previous permissive result must never bypass the no-skips verdict of an integration invocation, and the
	// skip ratchet must judge tests that ran now.
	outputs.upToDateWhen { !strictIntegration && skipBaseline == null }
	def totals = [tests: 0, skipped: 0]
	afterSuite { descriptor, result ->
		if (descriptor.parent == null) {
			executedSuites.add(suiteName)
			totals.tests = result.testCount
			totals.skipped = result.skippedTestCount
			logger.lifecycle("${name}: ${result.testCount} tests, ${result.skippedTestCount} skipped, ${result.failedTestCount} failed")
		}
	}
	// After the task action, not in afterSuite: throwing there stopped the task before it wrote the reports this
	// message sends the reader to, so the skipped fixtures could not be looked up.
	doLast {
		if (strictIntegration && (totals.tests == 0 || totals.skipped > 0)) {
			throw new GradleException("${suiteName}: integrationTest requires executed assertions without skips; "
					+ "provide the fixtures reported in build/reports/tests/${suiteName}/index.html")
		}
	}
}
tasks.register('integrationTest') {
	group = 'verification'
	description = 'Run unit, transfer and tool tests strictly: missing game inputs or skipped assertions fail.'
	dependsOn 'test', 'transferTest', 'toolTest', 'linkToolTest'
	doFirst {
		if (stagedGameJars.size() != 3) throw new GradleException('integrationTest needs prepareDev first')
	}
	doLast {
		// Test callbacks are not invoked for NO-SOURCE tasks. Require concrete, nonempty results from both suites.
		['test', 'transferTest'].each { suite ->
			if (!executedSuites.contains(suite)) {
				throw new GradleException("integrationTest: ${suite} did not execute in this invocation; stale reports are not evidence")
			}
			def reports = fileTree("build/test-results/${suite}") { include 'TEST-*.xml' }.files
			def totals = [tests: 0, skipped: 0, failures: 0, errors: 0]
			def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
			factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
			reports.each { report ->
				def root = factory.newDocumentBuilder().parse(report).documentElement
				totals.keySet().each { key -> totals[key] += Integer.parseInt(root.getAttribute(key) ?: '0') }
			}
			if (totals.tests == 0 || totals.skipped > 0 || totals.failures > 0 || totals.errors > 0) {
				throw new GradleException("integrationTest: ${suite} needs executed, passing assertions without skips: ${totals}")
			}
		}
	}
}
tasks.register('skipRatchet', Exec) {
	group = 'verification'
	description = 'Fail when the tests skipped in this invocation differ from src/test/skip-baseline/<forbric.skipBaseline>.tsv.'
	onlyIf { skipBaseline != null }
	mustRunAfter 'test', 'transferTest'
	workingDir projectDir.parentFile
	doFirst {
		def command = [devPython, file('../tools/junit_report.py').absolutePath, 'ratchet', '--profile', skipBaseline,
				'--results', file('build/test-results').absolutePath, '--suites', 'test,transferTest',
				'--executed', executedSuites.join(','),
				'--baseline', file("src/test/skip-baseline/${skipBaseline}.tsv").absolutePath,
				'--actual', file("build/skip-baseline/skips-actual-${skipBaseline}.tsv").absolutePath,
				'--root', projectDir.parentFile.absolutePath]
		if (project.hasProperty('forbric.writeSkipBaseline')) command += '--write'
		commandLine command
	}
}
if (skipBaseline != null) tasks.named('check') { dependsOn 'skipRatchet' }
tasks.register('writeDevClasspath') {
	description = 'Write the current build paths for the portable launcher.'
	doLast {
		def destination = file('.dev/launch-build.json')
		destination.parentFile.mkdirs()
		destination.text = groovy.json.JsonOutput.toJson([
				bootJar: tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
				dependencies: configurations.runtimeClasspath.files.collect { it.absolutePath }])
	}
}
['Client', 'Server'].each { side ->
	tasks.register("run${side}", Exec) {
		group = 'development'
		description = "Launch the current source-built kernel ${side.toLowerCase()} after prepareDev."
		dependsOn 'jar', 'writeDevClasspath'
		workingDir projectDir.parentFile
		standardInput = System.in
		doFirst {
			if (stagedGameJars.size() != 3) throw new GradleException('Run prepareDev first, then runClient/runServer in a second invocation')
			def arguments = [devPython, devDriver, side.toLowerCase(), '--no-build',
					'--java', System.getProperty('java.home'), '--staged', stagedRoot.parentFile.absolutePath,
					'--mc-dir', mcLibraries.parentFile.absolutePath]
			if (project.hasProperty('forbric.instance')) arguments += ['--instance', file(project.property('forbric.instance')).absolutePath]
			if (project.hasProperty('forbric.acceptEula')) arguments += ['--accept-eula']
			if (project.hasProperty('forbric.dryRun')) arguments += ['--dry-run']
			commandLine arguments
		}
	}
}

